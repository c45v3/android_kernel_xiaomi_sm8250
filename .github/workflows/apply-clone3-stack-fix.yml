name: Apply clone3 stack fix
on:
  push:
    branches: [st19-clone3-stack-fix]
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kernel/fork.c
          sparse-checkout-cone-mode: false
      - name: Apply fix
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Commit fix
        run: |
          git config user.name 'Casue'
          git config user.email '169557182+c45v3@users.noreply.github.com'
          git add kernel/fork.c
          git diff --cached --check
          git commit -m 'UPSTREAM: clone3: validate stack arguments'
          git push origin HEAD:st19-clone3-stack-fix
